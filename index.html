<!DOCTYPE html>
<html lang="en">

  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <!-- Application Container -->
  <div id="app">
    <!-- Loading fallback for non-JS users -->
    <noscript>
      <div class="min-h-screen bg-gray-50 flex items-center justify-center">
        <div class="max-w-md mx-auto text-center p-8">
          <h1 class="text-2xl font-bold text-gray-900 mb-4">Link Preview Card Builder</h1>
          <p class="text-gray-600 mb-4">

          </p>
          <div class="text-sm text-gray-500">
            <p>This tool helps you create beautiful link preview cards for social media sharing.</p>
          </div>
        </div>
      </div>
    </noscript>

    <!-- Loading indicator -->
    <div id="loading" class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <h1 class="text-xl font-semibold text-gray-900 mb-2">Link Preview Card Builder</h1>
        <p class="text-gray-600">Loading application...</p>
      </div>
    </div>

  <!-- Main Application Script -->

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <!-- Add analytics script here if needed -->

  <!-- Service Worker for PWA (future enhancement) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
